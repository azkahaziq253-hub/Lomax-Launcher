name: Build Lomax Launcher

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      LOMAX_KEYSTORE_PASSWORD: ${{ secrets.LOMAX_KEYSTORE_PASSWORD }}
      LOMAX_KEY_ALIAS: ${{ secrets.LOMAX_KEY_ALIAS }}
      LOMAX_KEY_PASSWORD: ${{ secrets.LOMAX_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Rebrand ke Lomax Launcher + ambil submodule
        run: |
          chmod +x rebrand_lomax.sh scripts/*.sh
          ./rebrand_lomax.sh
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ambil JRE 8 (prebuilt dari AngelAuraMC)
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Persiapan
        run: |
          ./scripts/languagelist_updater.sh
          mkdir -p out

      - name: Build APK debug (untuk tes di HP)
        run: |
          gradle :app_pojavlauncher:assembleDebug
          cp app_pojavlauncher/build/outputs/apk/debug/*.apk out/LomaxLauncher-debug.apk

      - name: Siapkan keystore upload
        if: ${{ env.LOMAX_KEYSTORE_PASSWORD != '' }}
        run: echo "${{ secrets.LOMAX_KEYSTORE_BASE64 }}" | base64 -d > app_pojavlauncher/lomax_upload.jks

      - name: Build AAB untuk Google Play
        if: ${{ env.LOMAX_KEYSTORE_PASSWORD != '' }}
        run: |
          gradle :app_pojavlauncher:bundleGplay
          cp app_pojavlauncher/build/outputs/bundle/gplay/*.aab out/LomaxLauncher-playstore.aab

      - uses: actions/upload-artifact@v4
        with:
          name: LomaxLauncher-debug-apk
          path: out/*.apk

      - uses: actions/upload-artifact@v4
        if: ${{ env.LOMAX_KEYSTORE_PASSWORD != '' }}
        with:
          name: LomaxLauncher-playstore-aab
          path: out/*.aab
